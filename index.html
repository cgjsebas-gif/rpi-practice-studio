<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="A guided learning workspace for RPI coursework, with course-linked explanations, practice, review and local progress."
    />
    <meta name="color-scheme" content="light dark" />
    <title>RPI Practice Studio · Learn, Practice, Review</title>
    <script src="storage.js?v=lectures9"></script>
    <script>
      try {
        var t = StudioStorage.getItem("rpi-studio-theme") || "system";
        document.documentElement.dataset.theme =
          t === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : t;
      } catch (e) {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
    <link rel="stylesheet" href="style.css?v=lectures9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    />
    <link rel="stylesheet" href="orbitarium.css?v=lectures9" />
  </head>
  <body>
    <div id="app">
      <main class="boot-shell" aria-busy="true">
        <span class="eyebrow">RPI PRACTICE STUDIO</span>
        <h1>Preparing your study space…</h1>
        <p role="status">Loading your courses and saved progress.</p>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <p id="boot-recovery" hidden>
          Something could not load. Your saved progress has not been reset.
          <button onclick="location.reload()">Try again</button>
        </p>
      </main>
    </div>
    <script>
      window.addEventListener("error", function () {
        var el = document.getElementById("boot-recovery");
        if (el) {
          el.hidden = false;
          el.closest("main").setAttribute("aria-busy", "false");
        }
      });
      setTimeout(function () {
        var el = document.getElementById("boot-recovery");
        if (el) el.hidden = false;
      }, 10000);
    </script>
    <noscript
      >This study app needs JavaScript to run practice and save local
      progress.</noscript
    >
    <script src="questions.js?v=lectures9"></script>
    <script src="content.js?v=lectures9"></script>
    <script src="scope.js?v=lectures9"></script>
    <script src="engine.js?v=lectures9"></script>
    <script src="diagrams.js?v=lectures9"></script>
    <script src="orbit-core.js?v=lectures9"></script>
    <script src="orbit-calendar.js?v=lectures9"></script>
    <script src="review-missions.js?v=lectures9"></script>
    <script src="orbitarium.js?v=lectures9"></script>
    <script src="router.js?v=lectures9"></script>
    <script src="backup.js?v=lectures9"></script>
    <script src="app.js?v=lectures9"></script>
  </body>
</html>
